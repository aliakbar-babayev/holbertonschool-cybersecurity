# config/harden.cfg - all tunable values live here (no hardcoding in lib/)

LOG_FILE="/var/log/hardening.log"
BACKUP_DIR="/var/backups/hardening"

# --- SSH ---
SSH_PORT=2222
ALLOWED_SSH_USERS="student"          # space-separated list
SSH_PERMIT_ROOT_LOGIN="no"
SSH_PASSWORD_AUTH="no"               # only set to "no" if your user has a key installed!
SSH_MAX_AUTH_TRIES=3
SSH_CONFIG_FILE="/etc/ssh/sshd_config"

# --- Network ---
FIREWALL_ENABLED="yes"
ALLOWED_TCP_PORTS="2222"             # should include SSH_PORT
SYSCTL_FILE="/etc/sysctl.d/99-hardening.conf"

# --- Identity ---
PASS_MAX_DAYS=90
PASS_MIN_DAYS=1
PASS_WARN_AGE=7
LOGIN_DEFS_FILE="/etc/login.defs"

# --- System ---
SECURE_FILES="/etc/passwd:644 /etc/shadow:640 /etc/group:644 /etc/gshadow:640"
